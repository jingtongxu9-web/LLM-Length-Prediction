<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" role="img" aria-labelledby="title desc">
  <title id="title">Serving capacity-risk trade-off</title>
  <desc id="desc">Scatter plot compares request underallocation rate and KV overreservation for seven frozen allocation policies.</desc>
  <style>
    :root { color-scheme: light dark; }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #1f2937; }
    .muted { fill: #6b7280; }
    .grid { stroke: #d1d5db; stroke-width: 1; }
    .frame { fill: none; stroke: #9ca3af; stroke-width: 1; }
    @media (prefers-color-scheme: dark) {
      text { fill: #f3f4f6; } .muted { fill: #cbd5e1; }
      .grid { stroke: #475569; } .frame { stroke: #64748b; }
    }
  </style>
  <text x="450.0" y="28" text-anchor="middle" font-size="20" font-weight="600">Serving capacity–risk trade-off</text>
  <rect class="frame" x="90" y="65" width="765" height="370"/>
  <line class="grid" x1="90.0" y1="65" x2="90.0" y2="435"/>
  <text class="muted" x="90.0" y="457" text-anchor="middle" font-size="12">0%</text>
  <line class="grid" x1="243.0" y1="65" x2="243.0" y2="435"/>
  <text class="muted" x="243.0" y="457" text-anchor="middle" font-size="12">15%</text>
  <line class="grid" x1="396.0" y1="65" x2="396.0" y2="435"/>
  <text class="muted" x="396.0" y="457" text-anchor="middle" font-size="12">30%</text>
  <line class="grid" x1="549.0" y1="65" x2="549.0" y2="435"/>
  <text class="muted" x="549.0" y="457" text-anchor="middle" font-size="12">45%</text>
  <line class="grid" x1="702.0" y1="65" x2="702.0" y2="435"/>
  <text class="muted" x="702.0" y="457" text-anchor="middle" font-size="12">60%</text>
  <line class="grid" x1="855.0" y1="65" x2="855.0" y2="435"/>
  <text class="muted" x="855.0" y="457" text-anchor="middle" font-size="12">75%</text>
  <line class="grid" x1="90" y1="435.0" x2="855" y2="435.0"/>
  <text class="muted" x="78" y="439.0" text-anchor="end" font-size="12">0.1</text>
  <line class="grid" x1="90" y1="311.7" x2="855" y2="311.7"/>
  <text class="muted" x="78" y="315.7" text-anchor="end" font-size="12">1</text>
  <line class="grid" x1="90" y1="188.3" x2="855" y2="188.3"/>
  <text class="muted" x="78" y="192.3" text-anchor="end" font-size="12">10</text>
  <line class="grid" x1="90" y1="65.0" x2="855" y2="65.0"/>
  <text class="muted" x="78" y="69.0" text-anchor="end" font-size="12">100</text>
  <circle cx="90.0" cy="423.6" r="6" fill="#64748b" stroke="#ffffff" stroke-width="1.5"/>
  <text x="98.0" y="415.6" text-anchor="start" font-size="12">Oracle</text>
  <circle cx="90.0" cy="90.7" r="6" fill="#64748b" stroke="#ffffff" stroke-width="1.5"/>
  <text x="98.0" y="105.7" text-anchor="start" font-size="12">Fixed 4096</text>
  <circle cx="496.1" cy="319.3" r="6" fill="#64748b" stroke="#ffffff" stroke-width="1.5"/>
  <text x="421.1" y="308.3" text-anchor="end" font-size="12">ALPS mean</text>
  <circle cx="766.9" cy="393.1" r="6" fill="#64748b" stroke="#ffffff" stroke-width="1.5"/>
  <text x="706.9" y="381.1" text-anchor="end" font-size="12">PLP v3</text>
  <circle cx="792.0" cy="384.9" r="6" fill="#14b8a6" stroke="#ffffff" stroke-width="1.5"/>
  <text x="800.0" y="399.9" text-anchor="start" font-size="12">Concat</text>
  <circle cx="518.1" cy="322.9" r="6" fill="#2563eb" stroke="#ffffff" stroke-width="1.5"/>
  <text x="528.1" y="337.9" text-anchor="start" font-size="12">Scalar mean</text>
  <circle cx="134.1" cy="214.7" r="6" fill="#2563eb" stroke="#ffffff" stroke-width="1.5"/>
  <text x="142.1" y="206.7" text-anchor="start" font-size="12">Scalar q97.5</text>
  <text x="472.5" y="490" text-anchor="middle" font-size="13">Request underallocation rate (lower is safer)</text>
  <text transform="translate(24 250) rotate(-90)" text-anchor="middle" font-size="13">KV overreservation (GiB, log scale)</text>
</svg>
